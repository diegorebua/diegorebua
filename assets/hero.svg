<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Diego Rebuá — desenvolvedor full stack">
<title>Diego Rebuá — desenvolvedor full stack</title>
<defs>
